
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gram Panchayat Admin Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eaf5ec;
    margin: 0;
    padding: 15px;
}

.container {
    max-width: 1000px;
    margin: auto;
}

header {
    background: #176b38;
    color: white;
    padding: 20px;
    text-align: center;
    border-radius: 10px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin: 20px 0;
}

.card {
    background: white;
    padding: 18px;
    text-align: center;
    border-radius: 10px;
    box-shadow: 0 2px 6px #ccc;
}

.card h2 {
    color: #176b38;
    margin: 5px;
}

.section {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #176b38;
    color: white;
}

select {
    padding: 8px;
    border: 1px solid #aaa;
    border-radius: 5px;
}

button {
    background: #176b38;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
}

.empty {
    text-align: center;
    padding: 20px;
    color: #777;
}

@media (min-width: 650px) {
    .stats {
        grid-template-columns: repeat(4, 1fr);
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>Gram Panchayat</h1>
    <h2>Admin Dashboard</h2>
    <p>Complaint Management System</p>
</header>
  <div style="text-align:center; margin-top:15px;">

    <button onclick="changeLanguage('en')">
        English
    </button>

    <button onclick="changeLanguage('kn')">
        ಕನ್ನಡ
    </button>

  </div>

<div class="stats">

    <div class="card">
        <p>Total Complaints</p>
        <h2 id="total">0</h2>
    </div>

    <div class="card">
        <p>Pending</p>
        <h2 id="pending">0</h2>
    </div>

    <div class="card">
        <p>In Progress</p>
        <h2 id="progress">0</h2>
    </div>

    <div class="card">
        <p>Resolved</p>
        <h2 id="resolved">0</h2>
    </div>

</div>

<div class="section">
    <h2>All Complaints</h2>

    <button onclick="loadComplaints()">Refresh</button>
  <br><br>

<button onclick="exportComplaints()">
    Download Complaint Report
</button>
  <br><br>

<input
    type="text"
    id="searchInput"
    placeholder="Search by Complaint ID..."
    oninput="loadComplaints()"
    style="padding:12px; width:100%; margin-bottom:10px;"
>

<select
    id="statusFilter"
    onchange="loadComplaints()"
    style="padding:12px; width:100%; margin-bottom:15px;"
>
    <option value="All">All Complaints</option>
    <option value="Pending">Pending</option>
    <option value="In Progress">In Progress</option>
    <option value="Resolved">Resolved</option>
</select>

    <table>
        <thead>
            <tr>
    <th>Complaint ID</th>
    <th>Submitted Date</th>
    <th>Name</th>
    <th>Category</th>
    <th>Village</th>
    <th>Location</th>
    <th>Photo</th>
    <th>Status</th>
    <th>Action</th>
            </tr>
        </thead>

        <tbody id="complaintTable">
        </tbody>
    </table>

    <p id="empty" class="empty">
        No complaints found.
    </p>
</div>

</div>

<script>

function loadComplaints() {

    let complaints = JSON.parse(
        localStorage.getItem("complaints") || "[]"
    );

    let table = document.getElementById("complaintTable");
    table.innerHTML = "";

    document.getElementById("total").innerText =
        complaints.length;

    document.getElementById("pending").innerText =
        complaints.filter(c => c.status === "Pending").length;

    document.getElementById("progress").innerText =
        complaints.filter(c => c.status === "In Progress").length;

    document.getElementById("resolved").innerText =
        complaints.filter(c => c.status === "Resolved").length;

    document.getElementById("empty").style.display =
        complaints.length === 0 ? "block" : "none";

    let searchText = document.getElementById("searchInput")
    .value.trim().toLowerCase();

let selectedStatus = document.getElementById("statusFilter").value;

complaints.forEach((c, index) => {

    let matchesSearch = String(c.id || "")
        .toLowerCase().includes(searchText);

    let matchesStatus =
        selectedStatus === "All" ||
        (c.status || "Pending") === selectedStatus;

    if (!matchesSearch || !matchesStatus) {
        return;

    }

        let row = document.createElement("tr");

        let values = [
    c.id,
    c.date || "Not available",
    c.name,
    c.category,
    c.village,
    c.location
];

values.forEach(value => {
    let cell = document.createElement("td");
    cell.textContent = value || "";
    row.appendChild(cell);
});

// Display complaint photo
let photoCell = document.createElement("td");

if (c.photo) {
    let img = document.createElement("img");
    img.src = c.photo;
    img.style.width = "70px";
    img.style.borderRadius = "6px";
    photoCell.appendChild(img);
} else {
    photoCell.textContent = "No Photo";
}

row.appendChild(photoCell);
        

        let statusCell = document.createElement("td");
        let select = document.createElement("select");

        ["Pending", "In Progress", "Resolved"].forEach(status => {
            let option = document.createElement("option");
            option.value = status;
            option.textContent = status;
            select.appendChild(option);
        });

        select.value = c.status || "Pending";

        select.addEventListener("change", function() {
            complaints[index].status = this.value;

            localStorage.setItem(
                "complaints",
                JSON.stringify(complaints)
            );

            loadComplaints();
        });

        statusCell.appendChild(select);
row.appendChild(statusCell);

// Action Buttons
let actionCell = document.createElement("td");

// View Details Button
let viewButton = document.createElement("button");

viewButton.textContent = "View Details";

viewButton.addEventListener("click", function() {
    window.location.href =
        "details.html?id=" + encodeURIComponent(c.id);
});

actionCell.appendChild(viewButton);

// Delete Button
let deleteButton = document.createElement("button");

deleteButton.textContent = "Delete";
deleteButton.style.background = "red";
deleteButton.style.marginTop = "8px";

deleteButton.addEventListener("click", function() {

    let confirmDelete = confirm(
        "Are you sure you want to delete this complaint?"
    );

    if (confirmDelete) {

        let latestComplaints = JSON.parse(
            localStorage.getItem("complaints") || "[]"
        );

        latestComplaints = latestComplaints.filter(
            item => item.id !== c.id
        );

        localStorage.setItem(
            "complaints",
            JSON.stringify(latestComplaints)
        );

        loadComplaints();
    }
});

actionCell.appendChild(deleteButton);

row.appendChild(actionCell);

table.appendChild(row);
    });
}

loadComplaints();

function changeLanguage(lang) {
  localStorage.setItem("adminLanguage", lang);

    if (lang === "kn") {

        document.querySelector("header h1").innerText =
            "ಗ್ರಾಮ ಪಂಚಾಯತ್";

        document.querySelector("header h2").innerText =
            "ನಿರ್ವಾಹಕ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್";

        document.querySelector("header p").innerText =
            "ದೂರು ನಿರ್ವಹಣಾ ವ್ಯವಸ್ಥೆ";

        document.querySelector(".section h2").innerText =
            "ಎಲ್ಲಾ ದೂರುಗಳು";

        document.querySelector(
            'button[onclick="loadComplaints()"]'
        ).innerText = "ರಿಫ್ರೆಶ್";

        document.getElementById("searchInput").placeholder =
            "ದೂರು ಸಂಖ್ಯೆಯಿಂದ ಹುಡುಕಿ...";

        let options = document.querySelectorAll(
            "#statusFilter option"
        );

        options[0].textContent = "ಎಲ್ಲಾ ದೂರುಗಳು";
        options[1].textContent = "ಬಾಕಿ";
        options[2].textContent = "ಪ್ರಗತಿಯಲ್ಲಿದೆ";
        options[3].textContent = "ಪರಿಹರಿಸಲಾಗಿದೆ";

        let headings = document.querySelectorAll("thead th");

        let kannadaHeadings = [
            "ದೂರು ಸಂಖ್ಯೆ",
            "ಹೆಸರು",
            "ವರ್ಗ",
            "ಗ್ರಾಮ",
            "ಸ್ಥಳ",
            "ಸ್ಥಿತಿ",
            "ಕ್ರಿಯೆ"
        ];

        headings.forEach((heading, index) => {
            if (kannadaHeadings[index]) {
                heading.textContent = kannadaHeadings[index];
            }
        });
      // Translate dashboard cards

let cardLabels = document.querySelectorAll(".card p");

let kannadaLabels = [
    "ಒಟ್ಟು ದೂರುಗಳು",
    "ಬಾಕಿ",
    "ಪ್ರಗತಿಯಲ್ಲಿದೆ",
    "ಪರಿಹರಿಸಲಾಗಿದೆ"
];

cardLabels.forEach((label, index) => {
    label.textContent = kannadaLabels[index];
});

// Translate Refresh button

document.querySelector(
    'button[onclick="loadComplaints()"]'
).textContent = "ಮರುಲೋಡ್";

// Translate action buttons

document.querySelectorAll("#complaintTable button")
.forEach(button => {

    if (button.textContent.trim() === "View Details") {
        button.textContent = "ವಿವರಗಳನ್ನು ನೋಡಿ";
    }

    if (button.textContent.trim() === "Delete") {
        button.textContent = "ಅಳಿಸಿ";
    }

});

    } else {

        location.reload();

    }
}
const savedLanguage =
    localStorage.getItem("adminLanguage") || "en";

if (savedLanguage === "kn") {
    changeLanguage("kn");
}
  
function exportComplaints() {

    let complaints = JSON.parse(
        localStorage.getItem("complaints") || "[]"
    );

    if (complaints.length === 0) {
        alert("No complaints available to download!");
        return;
    }

    let headers = [
        "Complaint ID",
        "Submitted Date",
        "Name",
        "Mobile",
        "Village",
        "Category",
        "Location",
        "Description",
        "Status"
    ];

    let rows = complaints.map(c => [
        c.id,
        c.date || "Not available",
        c.name,
        c.mobile,
        c.village,
        c.category,
        c.location,
        c.description,
        c.status
    ]);

    function escapeCSV(value) {
        return '"' + String(value || "")
            .replace(/"/g, '""') + '"';
    }

    let csvContent = [
        headers,
        ...rows
    ].map(row =>
        row.map(escapeCSV).join(",")
    ).join("\r\n");

    let blob = new Blob(
        ["\uFEFF" + csvContent],
        { type: "text/csv;charset=utf-8;" }
    );

    let url = URL.createObjectURL(blob);

    let link = document.createElement("a");
    link.href = url;
    link.download = "Gram_Panchayat_Complaints.csv";

    document.body.appendChild(link);

    link.click();

    // Remove the temporary link
    setTimeout(function() {
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
   }, 2000);

    alert("Complaint report downloaded successfully!");
}

</script>

</body>
</html>
