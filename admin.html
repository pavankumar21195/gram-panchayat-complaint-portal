
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gram Panchayat Admin Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eaf5ec;
    margin: 0;
    padding: 15px;
}

.container {
    max-width: 1000px;
    margin: auto;
}

header {
    background: #176b38;
    color: white;
    padding: 20px;
    text-align: center;
    border-radius: 10px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin: 20px 0;
}

.card {
    background: white;
    padding: 18px;
    text-align: center;
    border-radius: 10px;
    box-shadow: 0 2px 6px #ccc;
}

.card h2 {
    color: #176b38;
    margin: 5px;
}

.section {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #176b38;
    color: white;
}

select {
    padding: 8px;
    border: 1px solid #aaa;
    border-radius: 5px;
}

button {
    background: #176b38;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
}

.empty {
    text-align: center;
    padding: 20px;
    color: #777;
}

@media (min-width: 650px) {
    .stats {
        grid-template-columns: repeat(4, 1fr);
    }
}
</style>
</head>

<body>

<div class="container">

<header> 
    <h1>Gram Panchayat</h1>
    <h2>Admin Dashboard</h2>
    <p>Complaint Management System</p>
</header>
   <div style="text-align:center; margin-top:15px;">

    <button onclick="logoutAdmin()">
        Logout
    </button>

</div>
  <div style="text-align:center; margin-top:15px;">

    <button onclick="changeLanguage('en')">
        English
    </button>

    <button onclick="changeLanguage('kn')">
        ಕನ್ನಡ
    </button>

  </div>

<div class="stats">

    <div class="card">
        <p>Total Complaints</p>
        <h2 id="total">0</h2>
    </div>

    <div class="card">
        <p>Pending</p>
        <h2 id="pending">0</h2>
    </div>

    <div class="card">
        <p>In Progress</p>
        <h2 id="progress">0</h2>
    </div>

    <div class="card">
        <p>Resolved</p>
        <h2 id="resolved">0</h2>
    </div>

</div>

<div class="section">
    <h2>All Complaints</h2>

    <button onclick="loadComplaints()">Refresh</button>
  <br><br>

<button onclick="exportComplaints()">
    Download Complaint Report
</button>
  <br><br>

<input
    type="text"
    id="searchInput"
    placeholder="Search by Complaint ID..."
    oninput="loadComplaints()"
    style="padding:12px; width:100%; margin-bottom:10px;"
>

<select
    id="statusFilter"
    onchange="loadComplaints()"
    style="padding:12px; width:100%; margin-bottom:15px;"
>
    <option value="All">All Complaints</option>
    <option value="Pending">Pending</option>
    <option value="In Progress">In Progress</option>
    <option value="Resolved">Resolved</option>
</select>

    <table>
        <thead>
            <tr>
    <th>Complaint ID</th>
    <th>Submitted Date</th>
    <th>Name</th>
    <th>Category</th>
    <th>Village</th>
    <th>Location</th>
    <th>Photo</th>
    <th>Status</th>
    <th>Action</th>
            </tr>
        </thead>

        <tbody id="complaintTable">
        </tbody>
    </table>

    <p id="empty" class="empty">
        No complaints found.
    </p>
</div>

</div>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://qdxvpngrmatmhuqnjxjy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_5fJ8AofNDxLRRgQOSiz5cQ_OkqlSgmU';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
window.supabaseClient = supabase;
async function checkAdmin() {
    const { data: { user }, error } =
        await supabase.auth.getUser();

    if (error || !user) {
        window.location.replace('login.html');
        return;
    }

    const { data: profile, error: profileError } =
        await supabase
            .from('profiles')
            .select('role')
            .eq('id', user.id)
            .single();

    if (profileError || !profile || profile.role !== 'admin') {
        window.location.replace('complaint.html');
        return;
    }

    document.body.style.display = 'block';
window.loadComplaints();
}

document.body.style.display = 'none';
checkAdmin();
</script>

<script>
async function logoutAdmin() {
    const { error } =
        await window.supabaseClient.auth.signOut();

    if (error) {
        alert(error.message);
        return;
    }

    window.location.replace("login.html");
}

async function loadComplaints() {
    const supabase = window.supabaseClient;

    if (!supabase) return;

    const table = document.getElementById("complaintTable");
    const empty = document.getElementById("empty");

    table.innerHTML = "";
    empty.style.display = "none";

    const { data: complaints, error } = await supabase
        .from("complaints")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        alert("Error loading complaints: " + error.message);
        return;
    }

    const all = complaints || [];

    document.getElementById("total").innerText = all.length;

    document.getElementById("pending").innerText =
        all.filter(c =>
            c.status === "Pending" || c.status === "Received"
        ).length;

    document.getElementById("progress").innerText =
        all.filter(c => c.status === "In Progress").length;

    document.getElementById("resolved").innerText =
        all.filter(c => c.status === "Resolved").length;

    const searchText = document.getElementById("searchInput")
        .value.trim().toLowerCase();

    const selectedStatus =
        document.getElementById("statusFilter").value;

    const filtered = all.filter(c => {
        const matchesSearch = String(c.id || "")
            .toLowerCase().includes(searchText);

        const matchesStatus =
            selectedStatus === "All" ||
            (selectedStatus === "Pending"
                ? ["Pending", "Received"].includes(c.status)
                : c.status === selectedStatus);

        return matchesSearch && matchesStatus;
    });

    if (filtered.length === 0) {
        empty.style.display = "block";
        return;
    }

    filtered.forEach(c => {
        const row = document.createElement("tr");

        const values = [
            c.id,
            c.created_at
                ? new Date(c.created_at).toLocaleString()
                : "Not available",
            c.name,
            c.category,
            c.village,
            c.location
        ];

        values.forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value || "";
            row.appendChild(cell);
        });

        // Photo
        const photoCell = document.createElement("td");

        if (c.photo_url) {
            const img = document.createElement("img");
            img.src = c.photo_url;
            img.style.width = "70px";
            img.style.borderRadius = "6px";
            img.alt = "Complaint photo";
            photoCell.appendChild(img);
        } else {
            photoCell.textContent = "No Photo";
        }

        row.appendChild(photoCell);

        // Status
        const statusCell = document.createElement("td");
        const statusSelect = document.createElement("select");

        ["Received", "Pending", "In Progress", "Resolved"]
            .forEach(status => {
                const option = document.createElement("option");
                option.value = status;
                option.textContent = status;
                statusSelect.appendChild(option);
            });

        statusSelect.value = c.status || "Received";

        statusSelect.addEventListener("change", async function() {
            const newStatus = this.value;
            this.disabled = true;

            const { error } = await supabase
                .from("complaints")
                .update({ status: newStatus })
                .eq("id", c.id);

            if (error) {
                alert("Status update failed: " + error.message);
            }

            await loadComplaints();
        });

        statusCell.appendChild(statusSelect);
        row.appendChild(statusCell);

        // Action buttons
        const actionCell = document.createElement("td");

        const viewButton = document.createElement("button");
        viewButton.textContent = "View Details";

        viewButton.addEventListener("click", function() {
            window.location.href =
                "details.html?id=" + encodeURIComponent(c.id);
        });

        actionCell.appendChild(viewButton);

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.style.background = "red";
        deleteButton.style.marginTop = "8px";

        deleteButton.addEventListener("click", async function() {
            if (!confirm("Are you sure you want to delete this complaint?")) {
                return;
            }

            const { error } = await supabase
                .from("complaints")
                .delete()
                .eq("id", c.id);

            if (error) {
                alert("Delete failed: " + error.message);
                return;
            }

            alert("Complaint deleted successfully!");
            await loadComplaints();
        });

        actionCell.appendChild(deleteButton);
        row.appendChild(actionCell);

        table.appendChild(row);
    });
}

// Make functions available to HTML buttons
window.logoutAdmin = logoutAdmin;
window.loadComplaints = loadComplaints;
window.exportComplaints = exportComplaints;
window.changeLanguage = changeLanguage;


// Kannada / English language
function changeLanguage(lang) {
    localStorage.setItem("adminLanguage", lang);

    if (lang === "kn") {
        document.querySelector("header h1").innerText =
            "ಗ್ರಾಮ ಪಂಚಾಯತ್";

        document.querySelector("header h2").innerText =
            "ನಿರ್ವಾಹಕ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್";

        document.querySelector("header p").innerText =
            "ದೂರು ನಿರ್ವಹಣಾ ವ್ಯವಸ್ಥೆ";

        document.querySelector(".section h2").innerText =
            "ಎಲ್ಲಾ ದೂರುಗಳು";

        document.querySelector(
            'button[onclick="loadComplaints()"]'
        ).innerText = "ಮರುಲೋಡ್";

        document.getElementById("searchInput").placeholder =
            "ದೂರು ಸಂಖ್ಯೆಯಿಂದ ಹುಡುಕಿ...";

        const headings = document.querySelectorAll("thead th");

        const kannadaHeadings = [
            "ದೂರು ಸಂಖ್ಯೆ",
            "ಸಲ್ಲಿಸಿದ ದಿನಾಂಕ",
            "ಹೆಸರು",
            "ವರ್ಗ",
            "ಗ್ರಾಮ",
            "ಸ್ಥಳ",
            "ಫೋಟೋ",
            "ಸ್ಥಿತಿ",
            "ಕ್ರಿಯೆ"
        ];

        headings.forEach((heading, index) => {
            heading.textContent = kannadaHeadings[index];
        });

        const options = document.querySelectorAll(
            "#statusFilter option"
        );

        const kannadaOptions = [
            "ಎಲ್ಲಾ ದೂರುಗಳು",
            "ಬಾಕಿ",
            "ಪ್ರಗತಿಯಲ್ಲಿದೆ",
            "ಪರಿಹರಿಸಲಾಗಿದೆ"
        ];

        options.forEach((option, index) => {
            if (kannadaOptions[index]) {
                option.textContent = kannadaOptions[index];
            }
        });

        const labels = [
            "ಒಟ್ಟು ದೂರುಗಳು",
            "ಬಾಕಿ",
            "ಪ್ರಗತಿಯಲ್ಲಿದೆ",
            "ಪರಿಹರಿಸಲಾಗಿದೆ"
        ];

        document.querySelectorAll(".card p").forEach((label, index) => {
            label.textContent = labels[index];
        });

    } else {
        location.reload();
    }
}


// Export complaints from Supabase
async function exportComplaints() {
    const supabase = window.supabaseClient;

    const { data: complaints, error } = await supabase
        .from("complaints")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        alert("Export failed: " + error.message);
        return;
    }

    if (!complaints || complaints.length === 0) {
        alert("No complaints available to download!");
        return;
    }

    const headers = [
        "Complaint ID",
        "Submitted Date",
        "Name",
        "Mobile",
        "Village",
        "Category",
        "Location",
        "Description",
        "Status"
    ];

    const rows = complaints.map(c => [
        c.id,
        c.created_at
            ? new Date(c.created_at).toLocaleString()
            : "",
        c.name,
        c.mobile,
        c.village,
        c.category,
        c.location,
        c.description,
        c.status
    ]);

    function escapeCSV(value) {
        return '"' + String(value ?? "").replace(/"/g, '""') + '"';
    }

    const csvContent = [
        headers,
        ...rows
    ].map(row =>
        row.map(escapeCSV).join(",")
    ).join("\r\n");

    const blob = new Blob(
        ["\uFEFF" + csvContent],
        { type: "text/csv;charset=utf-8;" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "Gram_Panchayat_Complaints.csv";

    document.body.appendChild(link);
    link.click();

    document.body.removeChild(link);
    URL.revokeObjectURL(url);

    alert("Complaint report downloaded successfully!");
}


// Add Received to the filter if it is not already present
const statusFilter = document.getElementById("statusFilter");

if (!Array.from(statusFilter.options).some(o => o.value === "Received")) {
    const receivedOption = document.createElement("option");
    receivedOption.value = "Received";
    receivedOption.textContent = "Received";
    statusFilter.insertBefore(receivedOption, statusFilter.options[1]);
}


// Apply saved language
const savedLanguage =
    localStorage.getItem("adminLanguage") || "en";

if (savedLanguage === "kn") {
    changeLanguage("kn");
}


</script>

</body>
</html>
