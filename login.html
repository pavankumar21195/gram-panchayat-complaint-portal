<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Citizen Login</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #eaf5ec;
    padding: 20px;
}
.container {
    max-width: 400px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
}
h2 {
    text-align: center;
    color: #075c2c;
}
input, button {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    box-sizing: border-box;
}
button {
    background: #08783b;
    color: white;
    border: none;
    border-radius: 6px;
}
a { color: #08783b; }
#message { overflow-wrap: anywhere; }
</style>
</head>
<body>

<div class="container">
<h2>Citizen Login</h2>

<form id="loginForm">
<input type="email" id="email"
placeholder="Enter Email" required>

<input type="password" id="password"
placeholder="Enter Password" required>

<button type="submit">Login</button>
</form>

<p id="message"></p>
<p>New citizen? <a href="register.html">Register here</a></p>
<a href="index.html">Back to Home</a>
</div>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://qdxvpngrmatmhuqnjxjy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_5fJ8AofNDxLRRgQOSiz5cQ_OkqlSgmU';

const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const form = document.getElementById('loginForm');
const message = document.getElementById('message');

form.addEventListener('submit', async function(event) {
    event.preventDefault();

    message.textContent = 'Logging in...';
    console.log('Login button clicked');

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
    });

    if (error) {
    message.textContent = 'Login error: ' + error.message;
    return;
}

    const { data: profile, error: profileError } =
        await supabase
        .from('profiles')
        .select('role')
        .eq('id', data.user.id)
        .single();

    if (profileError || !profile) {
        await supabase.auth.signOut();
        message.textContent = 'User profile not found.';
        return;
    }

    message.textContent = 'Login successful!';

    if (profile.role === 'admin') {
        window.location.href = 'admin.html';
    } else {
        window.location.href = 'complaint.html';
    }
});
</script>

</body>
</html>
