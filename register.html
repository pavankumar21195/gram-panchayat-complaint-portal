<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Citizen Registration</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #eaf5ec;
    padding: 20px;
}
.container {
    max-width: 400px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
}
h2 {
    text-align: center;
    color: #075c2c;
}
input, button {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    box-sizing: border-box;
}
button {
    background: #08783b;
    color: white;
    border: none;
    border-radius: 6px;
}
a { color: #08783b; }
#message { overflow-wrap: anywhere; }
</style>
</head>
<body>

<div class="container">
<h2>Citizen Registration</h2>

<form id="registerForm">
<input type="text" id="name" placeholder="Enter Name" required>
<input type="email" id="email" placeholder="Enter Email" required>
<input type="password" id="password" placeholder="Create Password" minlength="8" required>
<button type="submit">Register</button>
</form>

<p id="message"></p>
<p>Already registered? <a href="login.html">Login here</a></p>
<a href="index.html">Back to Home</a>
</div>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'sb_publishable_5fJ8AofNDxLRRgQOSiz5cQ_OkqlSgmU';
const SUPABASE_KEY = 'gram_panchayat_portal';

const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

document.getElementById('registerForm')
.addEventListener('submit', async function(event) {
    event.preventDefault();

    const message = document.getElementById('message');
    message.textContent = 'Registering...';

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
            data: { full_name: name }
        }
    });

    if (error) {
        message.textContent = error.message;
        return;
    }

    message.textContent = data.session
        ? 'Registration successful! You can now log in.'
        : 'Registration received! Check your email to confirm your account.';

    this.reset();
});
</script>

</body>
</html>
